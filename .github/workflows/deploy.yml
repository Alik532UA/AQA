name: CI & GitHub Pages Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm run audit:ci

      - name: Typecheck & diagnostics
        if: ${{ !cancelled() }}
        run: npm run check

      - name: Lint code & style
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Run unit tests
        if: ${{ !cancelled() }}
        run: npm test

      - name: Build static site
        id: build
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Build does not modify tracked files
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: git diff --exit-code

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build'

  deploy:
    needs: validate
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
