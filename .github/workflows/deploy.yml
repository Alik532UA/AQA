name: CI & Build Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm run audit:ci

      - name: Typecheck & diagnostics
        if: ${{ !cancelled() }}
        run: npm run check

      - name: Build
        id: build
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Build does not modify tracked files
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: git diff --exit-code

